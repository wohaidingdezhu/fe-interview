<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3 证书认证与临时密钥协商</title><desc id="desc">客户端与服务端交换 key share，派生握手密钥，验证服务端证书与签名及 Finished，之后使用应用流量密钥加密通信。不是旧 RSA 密钥传输流程。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#39775e"/></marker></defs><rect width="820" height="480" rx="12" fill="#f4f7f0"/><g font-family="system-ui,sans-serif"><text x="30" y="38" fill="#254633" font-size="20" font-weight="600">TLS 1.3：认证、协商、加密各司其职</text><text x="30" y="64" fill="#71836e" font-size="13">简化完整握手 · 证书认证 + 临时 (EC)DHE · 不含 PSK / 0-RTT 路径</text><g fill="#254633"><rect x="75" y="90" width="150" height="40" rx="5"/><rect x="595" y="90" width="150" height="40" rx="5"/></g><g fill="white" font-size="16"><text x="123" y="117">客户端</text><text x="643" y="117">服务端</text></g><g stroke="#b7cbb0" stroke-dasharray="4 4"><path d="M150 132 V400"/><path d="M670 132 V400"/></g><g stroke="#39775e" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M150 175 H664"/><path d="M670 230 H156"/><path d="M670 302 H156"/><path d="M150 357 H664"/></g><g fill="#3c5d44" font-size="14" text-anchor="middle"><text x="410" y="164">ClientHello：支持参数、key share</text><text x="410" y="219">ServerHello：选择参数、key share</text><text x="410" y="265" fill="#7b8e6b">双方派生握手密钥（共享秘密不在网上明文发送）</text><text x="410" y="291">加密的证书、CertificateVerify、Finished</text><text x="410" y="346">验证证书、主机名与签名后发送 Finished</text></g><rect x="75" y="401" width="670" height="42" rx="6" fill="#e3ecd9"/><text x="410" y="428" fill="#33563a" font-size="15" text-anchor="middle">应用数据使用派生流量密钥与 AEAD 保护 · 业务授权仍由应用负责</text></g></svg>
