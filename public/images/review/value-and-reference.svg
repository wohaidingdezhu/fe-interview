<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">JavaScript 对象引用值与局部重新赋值</title><desc id="desc">调用方变量和参数最初引用同一个对象，局部参数重新赋值后引用新对象，调用方变量保持不变；图示不约定堆栈物理布局。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#39775e"/></marker></defs><rect width="820" height="360" rx="12" fill="#f4f7f0"/><g font-family="system-ui, sans-serif"><text x="30" y="38" fill="#254633" font-size="20" font-weight="600">值与引用：同一个对象，不同的变量绑定</text><text x="30" y="65" fill="#71836e" font-size="13">ECMAScript 语义示意 · 不表示引擎的物理内存位置</text><g fill="white" stroke="#b9cdb2"><rect x="35" y="105" width="195" height="60" rx="6"/><rect x="35" y="210" width="195" height="60" rx="6"/><rect x="470" y="105" width="275" height="60" rx="6"/><rect x="470" y="210" width="275" height="60" rx="6"/></g><g font-size="16" fill="#334f3b"><text x="52" y="141">original（调用方）</text><text x="52" y="246">obj（局部参数）</text><text x="490" y="141">共享对象 { m: 40 }</text><text x="490" y="246">新对象 { m: 50 }</text></g><g fill="none" stroke="#39775e" stroke-width="2" marker-end="url(#arrow)"><path d="M230 135 H465"/><path d="M230 232 L462 152" stroke-dasharray="5 5"/><path d="M230 250 H465"/></g><text x="277" y="174" font-size="12" fill="#71836e">最初复制同一个引用值</text><text x="276" y="276" font-size="12" fill="#39775e">obj = 新对象：仅改变局部绑定</text><text x="35" y="324" font-size="14" fill="#526d50">修改共享对象的属性，调用方可见；重新赋值形参，不改变调用方变量。</text></g></svg>
