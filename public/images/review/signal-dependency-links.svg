<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Alien Signals v2.0.0 依赖边 Link</title><desc id="desc">一个 Link 同时关联源 dep 和订阅者 sub，并参加源的订阅链与订阅者的依赖链。写入时推送失效标记，读取时检查并按需求值。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#39775e"/></marker></defs><rect width="820" height="330" rx="12" fill="#f4f7f0"/><g font-family="system-ui,sans-serif"><text x="30" y="38" fill="#254633" font-size="20" font-weight="600">依赖与订阅：同一条边，两条链</text><text x="30" y="65" fill="#71836e" font-size="13">Alien Signals v2.0.0 · src/system.ts · Link 结构示意</text><g stroke="#b9cdb2" fill="white"><rect x="35" y="111" width="200" height="92" rx="6"/><rect x="305" y="98" width="210" height="118" rx="6"/><rect x="585" y="111" width="200" height="92" rx="6"/></g><g fill="#334f3b" font-size="16" text-anchor="middle"><text x="135" y="140">依赖源 dep</text><text x="410" y="126">Link { dep, sub }</text><text x="685" y="140">订阅者 sub</text></g><g fill="#71836e" font-size="12" text-anchor="middle"><text x="135" y="168">subs / subsTail</text><text x="410" y="158">prevSub ↔ nextSub</text><text x="410" y="187">prevDep ↔ nextDep</text><text x="685" y="168">deps / depsTail</text></g><g stroke="#39775e" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M235 151 H298"/><path d="M515 151 H578"/></g><text x="35" y="262" fill="#3c5d44" font-size="14">写入：push 标记可能失效；读取 / effect 执行前：pull 检查依赖并按需求值。</text><text x="35" y="295" fill="#71836e" font-size="13">“结果没变”可能要先运行 computed 才知道；可避免的是部分下游执行。</text></g></svg>
